# Builds the real Windows copy of KAYAN ERP, on a real Windows machine.
#
# Why this exists: `flutter build windows` needs Windows and Visual Studio, so
# the program cannot be built on a Linux or macOS workstation. PRs and pushes to main use this workflow to
# the build machine. It runs the very same script a developer would run
# (scripts\build-desktop-windows.ps1), then asks whether the result is really
# shippable (scripts\verify-package.ps1), and keeps the output.
#
# The only Windows application deliverable is KAYAN-Setup.exe. The assembled
# folder is an intermediate input to Inno Setup and is never published as ZIP.

# No database is involved: building the program does not need one. Running it
# does, and that is documented in docs\DESKTOP_WINDOWS.md.

name: Windows package

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "backend/**"
      - "lib/**"
      - "windows/**"
      - "scripts/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/windows-package.yml"
    tags: ["v*"]
  pull_request:
    # Before a change is merged, prove on a real Windows machine that the
    # package still builds and the single installer exists.
    paths:
      - "backend/**"
      - "lib/**"
      - "windows/**"
      - "scripts/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/windows-package.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify the Windows program
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Take the source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Install Node (for building only - it ships inside the package)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Show the build tools
        shell: pwsh
        run: |
          flutter --version
          node --version
          npm --version
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) { Write-Host "Inno Setup: $iscc" }
          else { Write-Host "Inno Setup: not found yet - the next step installs it" }

      - name: Install Inno Setup (the installer a customer runs)
        shell: pwsh
        run: |
          # The single setup installer must come out of every build, so the compiler
          # that makes the installer is installed here rather than left to
          # chance. Inno Setup is free and leaves no runtime dependency in
          # the customer's installation.
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco could not install Inno Setup" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup installed but ISCC.exe is not at $iscc" }
          Write-Host "Inno Setup ready: $iscc"

      - name: Check that the two backend implementations still agree
        shell: pwsh
        run: |
          # A second, before the long build: the desktop and the web
          # implementation of the backend layer must offer the same shape, and
          # analysis on a workstation only ever sees one of them.
          New-Item -ItemType Directory -Force -Path build | Out-Null
          cmd /c 'dart run tools\backend_shape_check.dart > build\shape-log.txt 2>&1'
          $code = $LASTEXITCODE
          Get-Content build\shape-log.txt
          if ($code -ne 0) { throw "the two backend implementations do not agree (exit code $code)" }

      - name: Build the program folder and the single installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          # Everything the build prints, including what it writes to stderr, goes
          # into a file through cmd's own redirection. Merging the streams
          # inside PowerShell instead turns the first line a tool writes to
          # stderr into an error record, and the real message is lost.
          flutter doctor -v > build\doctor.txt 2>&1
          cmd /c 'powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-desktop-windows.ps1 -SkipZip > build\build-log.txt 2>&1'
          $code = $LASTEXITCODE
          Write-Host "--- the end of the build log ---"
          Get-Content build\build-log.txt -Tail 60
          Write-Host "--- the build script exited with $code ---"
          if ($code -ne 0) {
            Get-Content build\build-log.txt -Tail 10 | ForEach-Object {
              Write-Output ("::error::" + ($_ -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'))
            }
            throw "the build script failed with exit code $code"
          }

      - name: Install and smoke-test the actual setup and local server
        shell: pwsh
        run: |
          try {
            & ./scripts/smoke-test-installed-windows.ps1 -SetupPath "build\desktop\KAYAN-Setup.exe" *> build\smoke-log.txt
          } catch {
            Add-Content -Path build\smoke-log.txt -Value ($_ | Out-String)
            throw
          } finally {
            if (Test-Path build\smoke-log.txt) {
              Get-Content build\smoke-log.txt
            }
          }
      - name: Sign installer when a trusted certificate is configured
        shell: pwsh
        env:
          KAYAN_SIGNING_CERT_PFX_BASE64: ${{ secrets.KAYAN_SIGNING_CERT_PFX_BASE64 }}
          KAYAN_SIGNING_CERT_PASSWORD: ${{ secrets.KAYAN_SIGNING_CERT_PASSWORD }}
        run: |
          $setup = "build\desktop\KAYAN-Setup.exe"
          if (-not $env:KAYAN_SIGNING_CERT_PFX_BASE64 -or -not $env:KAYAN_SIGNING_CERT_PASSWORD) {
            Write-Warning "Installer is unsigned. Windows SmartScreen may still warn; a trusted code-signing certificate is required to establish publisher reputation."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "kayan-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:KAYAN_SIGNING_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK signtool.exe was not found." }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:KAYAN_SIGNING_CERT_PASSWORD /tr "http://timestamp.digicert.com" /td SHA256 $setup
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
          & $signtool.FullName verify /pa /v $setup
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signature verification failed." }
          Remove-Item $pfx -Force
          Write-Host "Installer signature verified."
 
      - name: Check that the result is really shippable
        shell: pwsh
        run: |
          # Run in this shell rather than a nested Windows PowerShell: the check
          # reads package-lock.json, and the two versions read a file whose root
          # entry is named "" in different ways. It supports both, but the one
          # that runs here is the one that gets tested.
          & ./scripts/verify-package.ps1 *> build\verify-log.txt
          $code = $LASTEXITCODE
          Get-Content build\verify-log.txt
          $summary = Get-Content build\verify-log.txt |
            Select-String -Pattern "passed \d+, failed \d+" | Select-Object -First 1
          if ($summary) {
            # An annotation is the one part of a run a public repository shows
            # without signing in, so the verdict travels with the commit.
            Write-Host "::notice::package check: $($summary.Matches[0].Value)"
          }
          if ($code -ne 0) { throw "the package did not pass its checks (exit code $code)" }

      # A failed run on a public repository keeps its log behind a sign-in, so
      # the useful part of it is left somewhere anyone can read: a comment on
      # the commit that was being built. It is the last 150 lines of whichever
      # step broke.
      - name: If it broke, leave the log on the commit
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $logs = @("build\shape-log.txt", "build\build-log.txt", "build\smoke-log.txt", "build\verify-log.txt", "build\doctor.txt")
          $tails = @{ "build\shape-log.txt" = 60; "build\build-log.txt" = 300; "build\smoke-log.txt" = 200; "build\verify-log.txt" = 200; "build\doctor.txt" = 60 }
          $parts = @()
          foreach ($log in $logs) {
            if (Test-Path $log) {
              $lines = Get-Content $log -Tail $tails[$log]
              # npm prints a deprecation warning per package; they bury the one
              # line that says what actually broke.
              $lines = $lines | Where-Object { $_ -notmatch "^npm warn deprecated" }
              $parts += "### $log`n`n``````text`n" + ($lines -join "`n") + "`n``````"
            }
          }
          if ($parts.Count -eq 0) { $parts = @("(no build log was written - the step broke before it started)") }
          $body = "The Windows build of commit ${{ github.sha }} did not finish.`n`n" + ($parts -join "`n`n")
          Set-Content -Path build\comment.md -Value $body -Encoding utf8
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@build\comment.md

      - name: Check that the only deliverable exists
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem build\desktop -Filter "KAYAN-Setup.exe" -File -ErrorAction SilentlyContinue)
          if ($setup.Count -ne 1) { throw "Exactly one deliverable, KAYAN-Setup.exe, must be produced" }
          if (Test-Path "build\desktop\KAYAN-ERP-windows.zip") { throw "A ZIP was produced, but only KAYAN-Setup.exe is allowed" }
          Write-Host ("Only deliverable: " + $setup[0].Name + "  " + [math]::Round($setup[0].Length / 1MB, 1) + " MB")

      - name: Show what was produced
        shell: pwsh
        run: |
          Get-ChildItem build\desktop | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize
          Get-ChildItem build\desktop\KAYAN-ERP | Select-Object Name | Format-Table -AutoSize

      - name: Keep the single installer on this run
        uses: actions/upload-artifact@v4
        with:
          name: KAYAN-Setup
          path: build/desktop/KAYAN-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish the verified KAYAN-Setup.exe to GitHub Release for direct download
        if: success() && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = if ("${{ github.ref }}".StartsWith("refs/tags/v")) { "${{ github.ref_name }}" } else { "v1.0.1" }
          $setup = Join-Path (Get-Location) "build\desktop\KAYAN-Setup.exe"
          if (-not (Test-Path $setup)) { throw "KAYAN-Setup.exe was not produced" }
          $files = @($setup)

          # Say what was actually checked, in the release itself, so the files
          # carry their own evidence instead of asking anyone to trust them.
          $verdict = (Get-Content build\verify-log.txt |
            Select-String -Pattern "passed \d+, failed \d+" | Select-Object -First 1).Matches[0].Value
          $totalSize = (Get-Content build\build-log.txt |
            Select-String -Pattern "Total size\s*:\s*(.+)$" | Select-Object -First 1).Matches[0].Groups[1].Value.Trim()
          $builtOn = (Get-Content build\doctor.txt |
            Select-String -Pattern "Flutter \(Channel stable, ([^,]+)" | Select-Object -First 1).Matches[0].Groups[1].Value
          $setupName = "KAYAN-Setup.exe"
          $setupSizeMb = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          $setupSha256 = (Get-FileHash -Path $setup -Algorithm SHA256).Hash
          $sig = Get-AuthenticodeSignature -FilePath $setup
          $sigStatus = "$($sig.Status)"

          $notes = @"
          KAYAN ERP for Windows, built from commit ${{ github.sha }}.

          Direct Download
          ---------------
          https://github.com/${{ github.repository }}/releases/download/$tag/$setupName

          Install it
          ----------
          Run $setupName ($setupSizeMb MB, SHA-256: $setupSha256, Authenticode: $sigStatus). This release contains the single installer only.

          The program starts its own server: no terminal, no Node.js, no npm, no
          Flutter and no commands. The installer provisions its dedicated local PostgreSQL instance (KAYAN_PostgreSQL on port 5433).

          On a machine where the database is still empty the program asks for the
          first administrator, and creates the company, its roles and its chart
          of accounts around that person.

          What this build is
          ------------------
          Flutter $builtOn, on Windows, in release mode. The server inside it is
          the compiled NestJS build with production libraries only, running on
          the Node runtime that ships in the folder. Unpacked size: $totalSize.

          scripts\verify-package.ps1 checked the folder before it was published:
          $verdict.
          "@

          $notesFile = Join-Path $env:TEMP "kayan-release-notes.txt"
          Set-Content -Path $notesFile -Value $notes -Encoding UTF8

          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            $oldAssets = (& gh release view $tag --json assets --jq ".assets[].name") 2>$null
            foreach ($assetName in $oldAssets) {
              if ($assetName -and $assetName -ne $setupName) {
                Write-Host "Removing legacy release asset: $assetName"
                & gh release delete-asset $tag $assetName --yes
              }
            }
            & gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "could not upload $setupName to release $tag" }
            & gh release edit $tag --title "KAYAN ERP $tag - Windows" --notes-file $notesFile
          } else {
            & gh release create $tag --title "KAYAN ERP $tag - Windows" --notes-file $notesFile @files
            if ($LASTEXITCODE -ne 0) { throw "could not publish the package" }
          }
          Write-Host "::notice title=KAYAN-Setup.exe Published::Direct URL: https://github.com/${{ github.repository }}/releases/download/$tag/$setupName | Commit: ${{ github.sha }} | Size: $setupSizeMb MB | SHA256: $setupSha256 | Authenticode: $sigStatus"
