# Builds the real Windows copy of KAYAN ERP, on a real Windows machine.
#
# Why this exists: `flutter build windows` needs Windows and Visual Studio, so
# the program cannot be built on a Linux or macOS workstation. This workflow is
# the build machine. It runs the very same script a developer would run
# (scripts\build-desktop-windows.ps1), then asks whether the result is really
# shippable (scripts\verify-package.ps1), and keeps the output.
#
# What it produces:
#   * on every relevant push to main  -> the outputs are kept as build artifacts
#     (Actions tab of the run)
#   * on a version tag such as v1.0.0 -> the same files are published as a
#     GitHub release, which anyone can download without signing in:
#         KAYAN-ERP-windows.zip          the program folder, ready to copy
#         KAYAN-ERP-Setup-<version>.exe  the installer a customer double-clicks
#
# No database is involved: building the program does not need one. Running it
# does, and that is documented in docs\DESKTOP_WINDOWS.md.

name: Windows package

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "lib/**"
      - "windows/**"
      - "scripts/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/windows-package.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify the Windows program
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Take the source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Install Node (for building only - it ships inside the package)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Show the build tools
        shell: pwsh
        run: |
          flutter --version
          node --version
          npm --version
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) { Write-Host "Inno Setup: $iscc" }
          else { Write-Host "Inno Setup: not found - the installer step will be skipped" }

      - name: Check that the two backend implementations still agree
        shell: pwsh
        run: |
          # A second, before the long build: the desktop and the web
          # implementation of the backend layer must offer the same shape, and
          # analysis on a workstation only ever sees one of them.
          New-Item -ItemType Directory -Force -Path build | Out-Null
          cmd /c 'dart run tools\backend_shape_check.dart > build\shape-log.txt 2>&1'
          $code = $LASTEXITCODE
          Get-Content build\shape-log.txt
          if ($code -ne 0) { throw "the two backend implementations do not agree (exit code $code)" }

      - name: Build the program folder, the zip and the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          # Everything the build prints, including what it writes to stderr, goes
          # into a file through cmd's own redirection. Merging the streams
          # inside PowerShell instead turns the first line a tool writes to
          # stderr into an error record, and the real message is lost.
          flutter doctor -v > build\doctor.txt 2>&1
          cmd /c 'powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-desktop-windows.ps1 > build\build-log.txt 2>&1'
          $code = $LASTEXITCODE
          Write-Host "--- the end of the build log ---"
          Get-Content build\build-log.txt -Tail 60
          Write-Host "--- the build script exited with $code ---"
          if ($code -ne 0) { throw "the build script failed with exit code $code" }

      - name: Check that the result is really shippable
        shell: pwsh
        run: |
          # Run in this shell rather than a nested Windows PowerShell: the check
          # reads package-lock.json, and the two versions read a file whose root
          # entry is named "" in different ways. It supports both, but the one
          # that runs here is the one that gets tested.
          & ./scripts/verify-package.ps1 *> build\verify-log.txt
          $code = $LASTEXITCODE
          Get-Content build\verify-log.txt
          $summary = Get-Content build\verify-log.txt |
            Select-String -Pattern "passed \d+, failed \d+" | Select-Object -First 1
          if ($summary) {
            # An annotation is the one part of a run a public repository shows
            # without signing in, so the verdict travels with the commit.
            Write-Host "::notice::package check: $($summary.Matches[0].Value)"
          }
          if ($code -ne 0) { throw "the package did not pass its checks (exit code $code)" }

      # A failed run on a public repository keeps its log behind a sign-in, so
      # the useful part of it is left somewhere anyone can read: a comment on
      # the commit that was being built. It is the last 150 lines of whichever
      # step broke.
      - name: If it broke, leave the log on the commit
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $logs = @("build\shape-log.txt", "build\build-log.txt", "build\verify-log.txt", "build\doctor.txt")
          $tails = @{ "build\shape-log.txt" = 60; "build\build-log.txt" = 300; "build\verify-log.txt" = 200; "build\doctor.txt" = 60 }
          $parts = @()
          foreach ($log in $logs) {
            if (Test-Path $log) {
              $lines = Get-Content $log -Tail $tails[$log]
              # npm prints a deprecation warning per package; they bury the one
              # line that says what actually broke.
              $lines = $lines | Where-Object { $_ -notmatch "^npm warn deprecated" }
              $parts += "### $log`n`n``````text`n" + ($lines -join "`n") + "`n``````"
            }
          }
          if ($parts.Count -eq 0) { $parts = @("(no build log was written - the step broke before it started)") }
          $body = "The Windows build of commit ${{ github.sha }} did not finish.`n`n" + ($parts -join "`n`n")
          Set-Content -Path build\comment.md -Value $body -Encoding utf8
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@build\comment.md

      - name: Show what was produced
        shell: pwsh
        run: |
          Get-ChildItem build\desktop | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize
          Get-ChildItem build\desktop\KAYAN-ERP | Select-Object Name | Format-Table -AutoSize

      - name: Keep the outputs on this run
        uses: actions/upload-artifact@v4
        with:
          name: KAYAN-ERP-windows
          path: |
            build/desktop/*.zip
            build/desktop/*Setup*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish them as a downloadable release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(Get-ChildItem build\desktop -File | Where-Object { $_.Extension -in '.zip','.exe' } | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw "nothing to publish" }

          # Say what was actually checked, in the release itself, so the files
          # carry their own evidence instead of asking anyone to trust them.
          $verdict = (Get-Content build\verify-log.txt |
            Select-String -Pattern "passed \d+, failed \d+" | Select-Object -First 1).Matches[0].Value
          $totalSize = (Get-Content build\build-log.txt |
            Select-String -Pattern "Total size\s*:\s*(.+)$" | Select-Object -First 1).Matches[0].Groups[1].Value.Trim()
          $builtOn = (Get-Content build\doctor.txt |
            Select-String -Pattern "Flutter \(Channel stable, ([^,]+)" | Select-Object -First 1).Matches[0].Groups[1].Value

          $notes = @"
          KAYAN ERP for Windows, built from commit ${{ github.sha }}.

          Install it
          ----------
          Run KAYAN-ERP-Setup-$tag.exe, or unpack KAYAN-ERP-windows.zip anywhere
          and double-click erp_kayan.exe inside it.

          The program starts its own server: no terminal, no Node.js, no npm, no
          Flutter and no commands. What the machine does need is PostgreSQL,
          holding the company's data - see docs\DESKTOP_WINDOWS.md.

          On a machine where the database is still empty the program asks for the
          first administrator, and creates the company, its roles and its chart
          of accounts around that person.

          What this build is
          ------------------
          Flutter $builtOn, on Windows, in release mode. The server inside it is
          the compiled NestJS build with production libraries only, running on
          the Node runtime that ships in the folder. Unpacked size: $totalSize.

          scripts\verify-package.ps1 checked the folder before it was published:
          $verdict.
          "@

          # A tag is not the same thing as a release: deleting the release must
          # leave the tag alone, or the create that follows has nothing to
          # verify against. (--cleanup-tag deletes both, and the first run that
          # replaced an existing release failed exactly there.)
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes
          }
          gh release create $tag --verify-tag --title "KAYAN ERP $tag - Windows" --notes $notes @files
          if ($LASTEXITCODE -ne 0) {
            # Whatever stopped the create, the files are the point: try simply
            # putting them on the release of that name.
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "could not publish the package" }
          }
