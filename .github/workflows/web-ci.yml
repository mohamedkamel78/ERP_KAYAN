name: Flutter Web & Backend CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-test-and-build:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Generate Prisma Client
        run: |
          cd backend
          touch /tmp/schema-engine-stub /tmp/libquery_engine_stub.so.node
          chmod +x /tmp/schema-engine-stub
          PRISMA_SCHEMA_ENGINE_BINARY=/tmp/schema-engine-stub PRISMA_QUERY_ENGINE_LIBRARY=/tmp/libquery_engine_stub.so.node npx prisma generate

      - name: Run Backend Tests
        run: |
          cd backend
          npm test

      - name: Build Backend Production
        run: |
          cd backend
          npm run build

  flutter-web-build:
    name: Flutter Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Before the Flutter SDK is fetched: a single wrong `../` stops the
      # analyser from starting at all, and GitHub shows only the first ten
      # problems it finds. This names every one of them in a few seconds, so
      # a run is never spent discovering them one at a time.
      - name: Every Dart import points at a real file
        run: node tools/check-dart-imports.mjs

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: |
          set +e
          flutter analyze > /tmp/analyze.txt 2>&1
          status=$?
          set -e
          cat /tmp/analyze.txt
          # The number, published even when the answer is "all of them": a
          # report that says sixty checks passed should be readable as sixty.
          grep -E "checks passed" /tmp/apicheck.txt | tail -1 | sed -e 's/%/%25/g' -e 's/#/%23/g' | while IFS= read -r line; do
            echo "::notice::$line"
          done
          if [ "$status" -ne 0 ]; then
            {
              echo '### flutter analyze'
              echo '```'
              cat /tmp/analyze.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            for severity in error warning info; do
              grep -E "^ *${severity} •" /tmp/analyze.txt | head -10 | while IFS= read -r line; do
                echo "::${severity}::${line}"
              done
            done
          fi
          exit "$status"

      - name: Run Flutter tests
        run: |
          set +e
          flutter test > /tmp/test.txt 2>&1
          status=$?
          set -e
          tail -n 60 /tmp/test.txt
          if [ "$status" -ne 0 ]; then
            {
              echo '### flutter test'
              echo '```'
              tail -n 120 /tmp/test.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -nE "\[E\]|Expected:|Actual:|Exception|The following|failed" /tmp/test.txt | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Build Flutter Web (Release)
        run: flutter build web --release

      - name: Keep the web build
        uses: actions/upload-artifact@v4
        with:
          name: KAYAN-ERP-web
          path: build/web
          retention-days: 14

  browser-checks:
    # The program's file promises, checked the way a person meets them: in a
    # real browser against the real server - download an export, open the
    # print page, choose and cancel a file, take a full backup and download
    # it. What is asserted comes from browser events (downloads, tabs,
    # network), not from pixels.
    name: Browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-test-and-build, flutter-web-build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Take the source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: PostgreSQL tools (the backup buttons call them)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Build the server
        working-directory: backend
        run: |
          npx prisma generate
          npm run build

      - name: Prepare the database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://kayan:kayan@127.0.0.1:5432/erp_kayan?schema=public
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set +e
          node scripts/prepare-database.mjs > /tmp/dbprep.txt 2>&1
          s1=$?
          cat /tmp/dbprep.txt
          npm run seed > /tmp/seed.txt 2>&1
          s2=$?
          cat /tmp/seed.txt
          set -e
          if [ "$s1" -ne 0 ] || [ "$s2" -ne 0 ]; then
            cat /tmp/dbprep.txt /tmp/seed.txt | tail -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Take the web build
        uses: actions/download-artifact@v4
        with:
          name: KAYAN-ERP-web
          path: web

      - name: Start the server with the web client
        env:
          DATABASE_URL: postgresql://kayan:kayan@127.0.0.1:5432/erp_kayan?schema=public
          KAYAN_WEB_ROOT: ${{ github.workspace }}/web
          KAYAN_BACKUP_DIR: /tmp/kayan-backups
          # One browser on one runner is one IP address, and the limiter counts
          # per address - so a job that drives a real session through four
          # screens spends the allowance a whole office shares on its own. The
          # ceiling is lifted here for that reason and for no other: the limiter
          # itself is what `rate-limit.guard.spec.ts` and the API job measure,
          # and what this job measures is whether a button hands over a file.
          # The traffic line the check prints (`TRAFFIC n call(s): ...`) is what
          # says whether a high number here is the job or a client that asks
          # again, and the check reports it either way.
          RATE_LIMIT_MAX: "3000"
          RATE_LIMIT_AUTH_MAX: "600"
          # Without these the program cannot sign a token, and the very
          # first thing the browser asks it to do is sign one. They are
          # throwaway values for a throwaway database.
          JWT_ACCESS_SECRET: ci-browser-check-access-secret
          JWT_REFRESH_SECRET: ci-browser-check-refresh-secret
          JWT_ACCESS_TTL: "900"
          JWT_REFRESH_TTL: "604800"
        run: |
          cd backend
          nohup node dist/src/main.js > /tmp/kayan-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/ >/dev/null

      - name: Browser checks against the real app
        env:
          APP_URL: http://127.0.0.1:3000
          OUT_DIR: ${{ github.workspace }}/e2e-out
        run: |
          npm install --no-save --prefix tools/browser puppeteer-core
          set +e
          node tools/browser/app_actions_check.mjs > /tmp/browser.txt 2>&1
          status=$?
          cat /tmp/browser.txt
          set -e
          grep -E "checks passed" /tmp/browser.txt | tail -1 | sed -e 's/%/%25/g' -e 's/#/%23/g' | while IFS= read -r line; do
            echo "::notice::browser check: $line"
          done
          # The tool writes what it saw into OUT_DIR either way; keep the
          # transcript with it, so the artifact explains itself.
          cp /tmp/browser.txt "${{ github.workspace }}/e2e-out/browser-check.log" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            # Everything the tool saw, on the run page, where it is read
            # without downloading an artifact.
            {
              echo '### Browser checks - the whole transcript'
              echo '```'
              cat /tmp/browser.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # A run keeps ten annotations and takes them from the top of the
            # stream, while a verdict sits at the bottom: one line per note
            # meant every failing check was cut off, and what was left for
            # reading was the sign-in, which had worked. One note, carrying
            # the verdict, is the shape that survives.
            verdict=$(
              {
                grep -E "^(FAIL|NAV|FILE|HTTP|TRAFFIC|SERVER|SCREEN|LABELS missed|the browser check)" /tmp/browser.txt | tail -16
                grep -E "checks passed" /tmp/browser.txt | tail -1
                # A 500 the server logged is worth more than any guess about
                # one: the stack that followed it says which line failed.
                sed -r 's/\x1b\[[0-9;]*m//g' /tmp/kayan-server.log \
                  | grep -A 5 "Unhandled exception" | tail -12
              } | sed -e 's/%/%25/g' -e 's/#/%23/g' -e 's/\r//g' \
                  | awk 'BEGIN{ORS="%0A"} {print}' | sed -e 's/%0A$//'
            )
            echo "::error::browser check: ${verdict}"
            exit "$status"
          fi

      - name: Keep the server's own log
        if: always()
        run: |
          cp /tmp/kayan-server.log "${{ github.workspace }}/e2e-out/server.log" 2>/dev/null || true

      - name: Keep what the browser saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: e2e-out
          if-no-files-found: warn

      - name: Say what the browser saw
        if: always()
        run: |
          if [ -f "${{ github.workspace }}/e2e-out/summary.txt" ]; then
            {
              echo '### Browser checks'
              echo '```'
              cat "${{ github.workspace }}/e2e-out/summary.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  api-e2e:
    # Every promise a screen makes, checked at the route that keeps it, over a
    # real PostgreSQL: a backup that is created, listed and downloaded; a
    # download ticket that opens a file for a minute and a sign-in token that
    # does not; an upload that is refused before it touches anything; a restore
    # rehearsed in a scratch database and verified afterwards; a session that
    # renews itself instead of expiring mid-day; exports and print pages; an
    # import that writes nothing on a dry run and names the row that is wrong;
    # and the administrative reset, password-checked, that leaves a backup it
    # has verified behind it.
    #
    # Its own job, on its own database, because its last act is to wipe the
    # company it was handed: nothing else may be sitting on that database while
    # it happens. `KAYAN_E2E_ALLOW_RESET=1` is what says this database is
    # disposable, and only a job that created it seconds earlier can mean it.
    name: API checks against a real database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-test-and-build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Take the source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: PostgreSQL tools (pg_dump and pg_restore are the product)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Build the server
        working-directory: backend
        run: |
          npx prisma generate
          npm run build

      # The role here is the one that owns the database, and it is on purpose:
      # a restore is only a real restore if the file was put into a scratch
      # database and read back there first, and a role that may not create a
      # database quietly skips that step (the program says so on its
      # capabilities route rather than hiding it). The check's own database is
      # created for the job and thrown away with it, so the role it runs as is
      # the job's business, and the rehearsal is proved on every run.
      - name: Prepare the database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_kayan_api?schema=public
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set +e
          node scripts/prepare-database.mjs > /tmp/dbprep.txt 2>&1
          s1=$?
          cat /tmp/dbprep.txt
          npm run seed > /tmp/seed.txt 2>&1
          s2=$?
          tail -n 5 /tmp/seed.txt
          set -e
          if [ "$s1" -ne 0 ] || [ "$s2" -ne 0 ]; then
            cat /tmp/dbprep.txt /tmp/seed.txt | tail -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Start the server
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_kayan_api?schema=public
          KAYAN_BACKUP_DIR: /tmp/kayan-api-backups
          JWT_ACCESS_SECRET: ci-api-check-access-secret
          JWT_REFRESH_SECRET: ci-api-check-refresh-secret
          JWT_ACCESS_TTL: "900"
          JWT_REFRESH_TTL: "604800"
        run: |
          mkdir -p /tmp/kayan-api-backups
          cd backend
          nohup node dist/src/main.js > /tmp/kayan-api-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/v1/health >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/api/v1/health >/dev/null

      - name: Drive every route the way the screens do
        working-directory: backend
        env:
          APP_URL: http://127.0.0.1:3000/api/v1
          KAYAN_E2E_ALLOW_RESET: "1"
        run: |
          set +e
          node scripts/api-check.mjs > /tmp/apicheck.txt 2>&1
          status=$?
          set -e
          cat /tmp/apicheck.txt
          {
            echo '### API checks against a real database'
            echo '```'
            cat /tmp/apicheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            failed=$(grep -E "^(FAIL|the check itself broke)" /tmp/apicheck.txt | tail -15 | sed -e 's/%/%25/g' -e 's/#/%23/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}' | sed -e 's/%0A$//')
            echo "::error::api check: ${failed}"
          fi
          exit "$status"

      - name: Keep what the API check saw
        if: always()
        run: |
          mkdir -p api-e2e-out
          cp /tmp/apicheck.txt api-e2e-out/api-check.log 2>/dev/null || true
          cp /tmp/kayan-api-server.log api-e2e-out/server.log 2>/dev/null || true
          ls -la /tmp/kayan-api-backups >> api-e2e-out/api-check.log 2>/dev/null || true

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-e2e
          path: api-e2e-out
          if-no-files-found: warn
          retention-days: 14
