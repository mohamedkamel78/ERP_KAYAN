name: Flutter Web & Backend CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-test-and-build:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Generate Prisma Client
        run: |
          cd backend
          touch /tmp/schema-engine-stub /tmp/libquery_engine_stub.so.node
          chmod +x /tmp/schema-engine-stub
          PRISMA_SCHEMA_ENGINE_BINARY=/tmp/schema-engine-stub PRISMA_QUERY_ENGINE_LIBRARY=/tmp/libquery_engine_stub.so.node npx prisma generate

      - name: Run Backend Tests
        run: |
          cd backend
          npm test

      - name: Build Backend Production
        run: |
          cd backend
          npm run build

  flutter-web-build:
    name: Flutter Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Before the Flutter SDK is fetched: a single wrong `../` stops the
      # analyser from starting at all, and GitHub shows only the first ten
      # problems it finds. This names every one of them in a few seconds, so
      # a run is never spent discovering them one at a time.
      - name: Every Dart import points at a real file
        run: node tools/check-dart-imports.mjs

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: |
          set +e
          flutter analyze > /tmp/analyze.txt 2>&1
          status=$?
          set -e
          cat /tmp/analyze.txt
          if [ "$status" -ne 0 ]; then
            {
              echo '### flutter analyze'
              echo '```'
              cat /tmp/analyze.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            head -n 25 /tmp/analyze.txt | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"

      - name: Run Flutter tests
        run: |
          set +e
          flutter test > /tmp/test.txt 2>&1
          status=$?
          set -e
          tail -n 60 /tmp/test.txt
          if [ "$status" -ne 0 ]; then
            {
              echo '### flutter test'
              echo '```'
              tail -n 120 /tmp/test.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -nE "\[E\]|Expected:|Actual:|Exception|The following|failed" /tmp/test.txt | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Build Flutter Web (Release)
        run: flutter build web --release

      - name: Keep the web build
        uses: actions/upload-artifact@v4
        with:
          name: KAYAN-ERP-web
          path: build/web
          retention-days: 14

  browser-checks:
    # The program's file promises, checked the way a person meets them: in a
    # real browser against the real server - download an export, open the
    # print page, choose and cancel a file, take a full backup and download
    # it. What is asserted comes from browser events (downloads, tabs,
    # network), not from pixels.
    name: Browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-test-and-build, flutter-web-build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Take the source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: PostgreSQL tools (the backup buttons call them)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Build the server
        working-directory: backend
        run: |
          npx prisma generate
          npm run build

      - name: Prepare the database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://kayan:kayan@127.0.0.1:5432/erp_kayan?schema=public
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set +e
          node scripts/prepare-database.mjs > /tmp/dbprep.txt 2>&1
          s1=$?
          cat /tmp/dbprep.txt
          npm run seed > /tmp/seed.txt 2>&1
          s2=$?
          cat /tmp/seed.txt
          set -e
          if [ "$s1" -ne 0 ] || [ "$s2" -ne 0 ]; then
            cat /tmp/dbprep.txt /tmp/seed.txt | tail -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Take the web build
        uses: actions/download-artifact@v4
        with:
          name: KAYAN-ERP-web
          path: web

      - name: Start the server with the web client
        env:
          DATABASE_URL: postgresql://kayan:kayan@127.0.0.1:5432/erp_kayan?schema=public
          KAYAN_WEB_ROOT: ${{ github.workspace }}/web
          KAYAN_BACKUP_DIR: /tmp/kayan-backups
          # Without these the program cannot sign a token, and the very
          # first thing the browser asks it to do is sign one. They are
          # throwaway values for a throwaway database.
          JWT_ACCESS_SECRET: ci-browser-check-access-secret
          JWT_REFRESH_SECRET: ci-browser-check-refresh-secret
          JWT_ACCESS_TTL: "900"
          JWT_REFRESH_TTL: "604800"
        run: |
          cd backend
          nohup node dist/src/main.js > /tmp/kayan-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/ >/dev/null

      - name: Browser checks against the real app
        env:
          APP_URL: http://127.0.0.1:3000
          OUT_DIR: ${{ github.workspace }}/e2e-out
        run: |
          npm install --no-save --prefix tools/browser puppeteer-core
          set +e
          node tools/browser/app_actions_check.mjs > /tmp/browser.txt 2>&1
          status=$?
          cat /tmp/browser.txt
          set -e
          # The tool writes what it saw into OUT_DIR either way; keep the
          # transcript with it, so the artifact explains itself.
          cp /tmp/browser.txt "${{ github.workspace }}/e2e-out/browser-check.log" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            # A 500 the server logged is worth more than any guess about
            # one: the stack that followed it says which line failed.
            sed -r 's/\x1b\[[0-9;]*m//g' /tmp/kayan-server.log \
              | grep -A 8 "Unhandled exception" | tail -40 \
              | while IFS= read -r line; do echo "::error::server: $line"; done
            # The tool prefixes what it saw - LABELS, INPUTS, SCREEN,
            # LOGIN - so a failure says what the page really offered
            # instead of only that a click missed.
            # GitHub keeps only the first ten annotations of a kind, so the
            # ones that say what failed go out before the ones that say what
            # the page looked like. Getting this the wrong way round is how
            # a run filled its quota with the login screen and dropped the
            # verdict.
            grep -E "^(FAIL|DIED)|checks passed|the browser check itself broke" /tmp/browser.txt \
              | head -12 | while IFS= read -r line; do
                echo "::error::$line"
              done
            # ...then whatever the log ended with, because a run that stops
            # mid-sentence is exactly the run whose ending matters most.
            tail -12 /tmp/browser.txt | while IFS= read -r line; do
              echo "::error::tail: $line"
            done
            # ...and only then the picture of the screen.
            grep -E "^(LABELS|INPUTS|SCREEN|CLICK|LOGIN|SERVER)" /tmp/browser.txt \
              | head -8 | while IFS= read -r line; do
                echo "::error::$line"
              done
            exit "$status"
          fi

      - name: Keep the server's own log
        if: always()
        run: |
          cp /tmp/kayan-server.log "${{ github.workspace }}/e2e-out/server.log" 2>/dev/null || true

      - name: Keep what the browser saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: e2e-out
          if-no-files-found: warn

      - name: Say what the browser saw
        if: always()
        run: |
          if [ -f "${{ github.workspace }}/e2e-out/summary.txt" ]; then
            {
              echo '### Browser checks'
              echo '```'
              cat "${{ github.workspace }}/e2e-out/summary.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
