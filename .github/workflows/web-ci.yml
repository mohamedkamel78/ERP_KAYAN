name: Flutter Web & Backend CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-test-and-build:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Generate Prisma Client
        run: |
          cd backend
          touch /tmp/schema-engine-stub /tmp/libquery_engine_stub.so.node
          chmod +x /tmp/schema-engine-stub
          PRISMA_SCHEMA_ENGINE_BINARY=/tmp/schema-engine-stub PRISMA_QUERY_ENGINE_LIBRARY=/tmp/libquery_engine_stub.so.node npx prisma generate

      - name: Run Backend Tests
        run: |
          cd backend
          npm test

      - name: Build Backend Production
        run: |
          cd backend
          npm run build

  flutter-web-build:
    name: Flutter Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: |
          set +e
          flutter analyze > /tmp/analyze.txt 2>&1
          status=$?
          set -e
          cat /tmp/analyze.txt
          if [ "$status" -ne 0 ]; then
            {
              echo '### flutter analyze'
              echo '```'
              cat /tmp/analyze.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "^ *(error|warning|info) •" /tmp/analyze.txt | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Run Flutter tests
        run: flutter test

      - name: Build Flutter Web (Release)
        run: flutter build web --release

      - name: Keep the web build
        uses: actions/upload-artifact@v4
        with:
          name: KAYAN-ERP-web
          path: build/web
          retention-days: 14
